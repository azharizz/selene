schema-version = 1

[package]
title = "SELENE"
version = "0.1.0"
id = "com.selene.tv"
build-number = 1
icon = "@image/selene-icon.png"

[os.version]
min = "1.2"
target = "1.2"

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"

[[needs.module]]
id = "/com.amazon.kepler.audio_lib_2@IAudioLib_0"

[[needs.module]]
id = "/com.amazon.kepler.security_manager_lib_1@ISecurityManagerLib_0"

[[needs.module]]
id = "/com.amazon.kepler.svg_3@ISVG_0"

[[needs.module]]
id = "/com.amazon.kepler.async_storage__async_storage_2@IAsyncStorage__AsyncStorage_1"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"


[components]
[[components.interactive]]
id = "com.selene.tv.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]

[wants]
# On-screen keyboard for the native question and import fields
[[wants.service]]
id = "com.amazon.inputmethod.service"

# Native W3C media playback
[[wants.service]]
id = "com.amazon.media.server"

# Required for emitting metrics from video playback
[[wants.service]]
id = "com.amazon.mediametrics.service"

# Required for video playback on stable APIs
[[wants.service]]
id = "com.amazon.mediabuffer.service"
[[wants.service]]
id = "com.amazon.mediatransform.service"

# Native audio playback
[[wants.service]]
id = "com.amazon.audio.stream"

# Audio focus and volume control for native playback
[[wants.service]]
id = "com.amazon.audio.control"

# Required by the native W3C media player (audio system connection)
[[wants.service]]
id = "com.amazon.audio.system"

# Required for the native PlayerSession media controls
[[wants.service]]
id = "com.amazon.media.playersession.service"

# Required for remote button events
[[wants.service]]
id = "com.amazon.inputd.service"

# Required by the Vega app-session notifier used for lifecycle handling
[[wants.service]]
id = "com.amazon.lcm.app.session.notifier.service"

# To enable accessibility support for your app, we recommend you add the UCC service with the Service Registrar
[[wants.service]]
id = "com.amazon.kepler.ucc.publisher"

# Uncomment below section to enable encrypted media playback (DRM content)
# [[wants.service]]
# id = "com.amazon.drm.key"
# [[wants.service]]
# id = "com.amazon.drm.crypto"
# [[needs.privilege]]
# id = "com.amazon.privilege.security.file-sharing"

# Required for native W3C media captions
[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

[[needs.privilege]]
id = "com.amazon.audio.privilege.microphone.access"

# Enable Group-IPC to access media services
[[wants.service]]
id = "com.amazon.gipc.uuid.*"
[offers]
[[offers.service]]
id = "com.amazon.gipc.uuid.*" 

# You may add other services as needed

# The development relay is loopback-only. Remote deployments must use HTTPS.
[network-traffic-policy.cleartext]
allowed-domains = ["127.0.0.1"]
